<style>/* ===== Mis Finanzas YHWH · negro con azul #1F1EBA ===== */
:root{color-scheme:dark;--bg:#050506;--card:#0e0e11;--card2:#12121c;--bd:#262675;--bdc:#2a2ac8;--bd2:#34348f;--mut:#8b8b9a;--mut2:#a1a1b1;--txt:#f4f4fb;--blue:#1F1EBA;--blue2:#3b3af0;--lav:#8c8cff;--lab:#7b7bf7;--fx:linear-gradient(180deg,rgba(31,30,186,.20) 0,rgba(31,30,186,.11) 90px,rgba(31,30,186,.04) 170px,transparent 240px),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px;--ok:#2ee6a6;--warn:#ffb020;--bad:#ff8a9a;--r:22px;--ease:cubic-bezier(.22,.8,.3,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable;background:var(--bg)}
html{background:var(--bg)}
html::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--fx)}
html,body{color:var(--txt);font:14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden;position:relative;z-index:1;background:transparent}
body.modal-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:#09090f;border:1px solid #2a2a70;border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:border-color .18s,box-shadow .18s,background .18s}
input:focus,select:focus,textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #1F1EBA55}
input[type=checkbox]{accent-color:var(--blue2);width:20px;height:20px;padding:0;box-shadow:none}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a8aa6 50%),linear-gradient(135deg,#8a8aa6 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.h{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
.hl{color:var(--lav)}
.mut{color:var(--mut)}
small{color:var(--mut);font-size:12px}
.amt{transition:filter .2s;font-variant-numeric:tabular-nums}
body.hide-all .amt,.hideme .amt{filter:blur(9px);user-select:none}
/* ===== estructura ===== */
#app{display:flex;min-height:100vh}
#side{width:236px;flex:none;border-right:1px solid #16164a;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
#side .lg{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:2px 10px 24px}
#side .lg .logo{width:158px}
.logo{position:relative;display:block;overflow:hidden;aspect-ratio:433/153;flex:none;user-select:none;-webkit-user-select:none}
.logo img{position:absolute;left:-8.083%;top:-122.22%;width:115.47%;height:auto;max-width:none;filter:url(#lum);pointer-events:none}
.tlogo{display:none;width:118px}
#side .lg b{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:11px;line-height:1.1;letter-spacing:.22em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:6px}
#side .lg b .hl{background:var(--blue);color:#fff;padding:4px 7px;border-radius:7px;box-shadow:0 0 16px rgba(31,30,186,.6)}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:#a4a4bd;font-weight:600;text-align:left;width:100%;position:relative}
.nv svg{width:19px;height:19px;flex:none}
.nv.on{background:var(--blue);color:#fff;box-shadow:0 6px 18px #1F1EBA55}
.nv:hover:not(.on){background:rgba(31,30,186,.16);color:#fff}
#main{flex:1;min-width:0;padding:22px 28px 110px}
#top{margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.trow{display:flex;align-items:center;gap:12px}
.trow h1{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:28px;flex:1;min-width:0;letter-spacing:-.3px}
.tctl{display:flex;align-items:center;gap:8px}
.trow2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.acc,.per,.tg{display:flex;gap:6px}
.acc{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:3px}
.acc button{padding:7px 15px;border-radius:999px;font-size:12px;font-weight:700;color:#a4a4bd;white-space:nowrap;transition:background .22s,color .22s,box-shadow .22s}
.acc button.on{background:#f4f4fe;color:#0a0a14;box-shadow:0 4px 16px rgba(244,244,254,.18)}
.per{flex-wrap:wrap;justify-content:flex-end}
.pb{padding:8px 13px;border-radius:999px;border:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--mut2);white-space:nowrap;letter-spacing:.3px;transition:background .22s,color .22s,border-color .22s,transform .12s}
.pb:hover{border-color:var(--bd2)}
.pb.on{background:var(--blue);color:#fff;border-color:var(--blue2);box-shadow:0 0 18px rgba(31,30,186,.55)}
.tg{border:1px solid var(--bd);border-radius:999px;padding:3px;gap:0;background:var(--card)}
.tg button{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;color:#a4a4bd;transition:background .22s,color .22s}
.tg button.on{background:var(--blue);color:#fff}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;color:#d4d4e6;flex:none;transition:background .2s,color .2s,border-color .2s,transform .12s}
.ib svg{width:17px;height:17px}
.ib:hover{border-color:var(--bd2)}
.ib.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.ib.sm{width:28px;height:28px}.ib.sm svg{width:14px;height:14px}
#syncdot{width:9px;height:9px;border-radius:50%;background:#55556a;flex:none;transition:background .3s}
#syncdot.ok{background:var(--ok)}#syncdot.pend{background:var(--warn)}#syncdot.busy{background:var(--lav);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
/* ===== tarjetas ===== */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
.w-S{grid-column:span 4}.w-M{grid-column:span 6}.w-L{grid-column:span 8}.w-F{grid-column:span 12}
.wd{position:relative;min-width:0;display:flex;flex-direction:column;container-type:inline-size;animation:wdin .42s var(--ease) both;animation-delay:calc(var(--i,0)*38ms)}
.wd.upd{animation:none}
.wd>.card{flex:1}
.card{background:radial-gradient(170% 150% at 0 0,rgba(31,30,186,.34) 0,rgba(31,30,186,.18) 45%,transparent 100%),var(--card);border:1px solid var(--bdc);border-radius:var(--r);padding:20px;transition:border-color .2s}
@media(hover:hover){.wd>.card:hover{border-color:var(--blue2)}}
.card.hl{position:relative;overflow:hidden;background:var(--blue);border-color:#3b3af0;color:#fff;box-shadow:0 12px 44px rgba(31,30,186,.45)}
.card.hl>*{position:relative;z-index:1}
.card.hl .mut,.card.hl small{color:#c8c8ff}
.card.hl .sub{color:#d4d4ff}
.card.upd,.wd.upd>.card{animation:updin .3s ease-out}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:28px}
.t{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--lab)}
/* tarjetas con gráfico o lista: título en blanco; las de una cifra llevan la etiqueta lavanda */
.card:has(.chart,.tr,.lgd) .ch .t{color:#fff;font-size:13px;letter-spacing:.8px}
.card.hl .ch .t{color:#dcdcff}
.card.hl .t{color:#dcdcff}
.ca{display:flex;gap:8px;align-items:center}
.ca .more{white-space:nowrap;flex:none}
.more{font-size:12px;font-weight:700;color:var(--lav);padding:4px 0;transition:color .15s,transform .15s}
.more:hover{color:#fff}
.big{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:clamp(32px,4.2vw,46px);line-height:1.05;letter-spacing:-.6px}
.mid{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:clamp(15px,10cqw,26px);line-height:1.1;white-space:nowrap}
.mid small{font-family:Inter,sans-serif;font-weight:500}
.sub{color:var(--mut2);font-size:13px;margin-top:6px}
.deuerr{margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(255,107,107,.14);color:#ffb3b3;font-size:12px;line-height:1.35}
.hl2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hl2>div{background:#ffffff1c;border:1px solid #ffffff22;border-radius:16px;padding:11px 14px;backdrop-filter:blur(4px)}
.hl2 small{display:block;margin-bottom:2px}
.hl2 b{font-size:16px;font-weight:800}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--bd2);white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .12s,box-shadow .2s}
.btn:hover{border-color:#44445f}
.btn.wh,.btn.bk{background:var(--blue);color:#fff;border-color:var(--blue2);box-shadow:0 4px 16px #1F1EBA55}
.btn.wh:hover,.btn.bk:hover{background:#2625d6}
.card.hl .btn.bk{background:#fff;color:var(--blue);border-color:#fff;box-shadow:0 4px 16px #0004}
.card.hl .btn.out{background:#ffffff1c;border-color:#ffffff44;color:#fff}
.btn.dg{color:var(--bad);border-color:#3d1c24}
.btn.dg2{background:#d93a4a;border-color:#d93a4a;color:#fff}
.btn:disabled{opacity:.55;pointer-events:none}
.btn svg{width:14px;height:14px}
.ib:active,.btn:active,.pb:active,.chk:active,.acc button:active,.tg button:active{transform:scale(.94)}
.card.hl .ib{color:#fff;border-color:#ffffff44}
/* ===== listas ===== */
.tb{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:var(--c,1fr 90px);gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #15151f;font-size:13px;border-radius:10px}
.tr:last-child{border-bottom:0}
.tr.th{font-size:10px;letter-spacing:1px;color:var(--mut);font-weight:700;text-transform:uppercase;padding-top:0}
.tr .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr .ed{display:none!important}
.tr .d{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tr.tot{border-top:1px solid var(--bd2);border-bottom:0;font-weight:800;margin-top:4px}
.tr[data-rt]{cursor:pointer;transition:background .15s}
@media(hover:hover){.tr[data-rt]:hover{background:#12121b}}
.tr[data-rt]:active{background:#161622}
.d2{min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}.d2 .d{max-width:100%}
.sm2{font-size:11px;color:var(--mut)}
.d.paid{color:var(--mut);text-decoration:line-through;text-decoration-color:#55556a}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.te{grid-template-columns:26px minmax(0,1fr) 112px 118px}
.tr.ig,.tr.rc{grid-template-columns:56px minmax(0,1fr) 130px}
.tr.sa{grid-template-columns:minmax(0,1fr) 140px}
.tr.dl{grid-template-columns:minmax(0,.9fr) minmax(0,1fr) 130px}
.tr.db{grid-template-columns:minmax(0,1.1fr) 90px minmax(0,1fr) 124px}
.tr.mv{grid-template-columns:48px minmax(0,1fr) 130px}
.tr.sel{background:#14141f;padding-left:8px;padding-right:8px}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid #4a4a63;display:inline-flex;align-items:center;justify-content:center;flex:none;color:transparent;transition:background .2s,border-color .2s,color .2s,transform .12s}
.chk.on{background:var(--blue);border-color:var(--blue2);color:#fff}
.chk svg{width:14px;height:14px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.5px;border:1px solid #2b2b40;color:#a9a9c4;white-space:nowrap}
.chip.w{border-color:#5a4210;background:#ffb02018;color:var(--warn)}
.chip.r{border-color:#5a1d27;background:#ff6b6b18;color:var(--bad)}
.empty{color:var(--mut);padding:14px 0;font-size:13px}
.morerow{display:block;width:100%;padding:12px 0 4px;margin-top:2px;border-top:1px solid #15151f;text-align:center;font-size:12px;font-weight:700;color:var(--lav);letter-spacing:.3px;transition:color .15s}
.morerow:hover{color:#fff}
.card>small{display:block;margin:-6px 0 10px}
.mo{display:none}
.row2,.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow .fl,.row2 .fl{min-width:0}
/* ===== gráficos ===== */
.chart{width:100%;position:relative}.chart svg{display:block;max-width:100%}
.lgd{display:flex;gap:16px;justify-content:flex-end;font-size:11px;color:#a9a9c4;margin:-4px 0 8px}
.lgd i{display:inline-block;width:18px;margin-right:6px;vertical-align:middle}
.lgd i.l1{height:3px;border-radius:2px;background:var(--lav)}
.lgd i.l2{height:2px;background:repeating-linear-gradient(90deg,#9a9ab0 0 2px,transparent 2px 6px)}
.dist{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:center}
.drow{display:grid;grid-template-columns:12px 1fr 44px auto;gap:10px;align-items:center;font-size:13px;margin:9px 0}
.drow i.dot{width:10px;height:10px;margin:0}
.hbl .hb{display:grid;grid-template-columns:minmax(70px,.9fr) minmax(0,2fr) auto 38px;gap:10px;align-items:center;margin:11px 0;font-size:13px}
.hb small{text-align:right}
div.bar{height:8px;border-radius:4px;background:#1a1a28;overflow:hidden}
div.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--lav));transform-origin:left;animation:grow .8s var(--ease) both}
svg path.bar{transform-box:fill-box;transform-origin:50% 100%;animation:barg .6s var(--ease) both;animation-delay:calc(var(--i,0)*28ms);transition:filter .15s}
svg path.bar:hover{filter:brightness(1.35)}
svg .ln1{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s var(--ease) forwards}
svg .ln2,svg .area{animation:vfade .9s .15s ease-out both}
svg .dt{transform-box:fill-box;transform-origin:center;animation:pop .4s var(--ease) both;animation-delay:calc(var(--i,0)*30ms + .4s);cursor:pointer}
svg .sl{transform-box:fill-box;transform-origin:center;animation:slin .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms);transition:opacity .15s;cursor:pointer}
svg .sl:hover{opacity:.82}
#tip{position:fixed;z-index:130;background:#1b1b2c;color:#fff;border:1px solid var(--bd2);padding:6px 11px;border-radius:10px;font-size:12px;font-weight:600;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;box-shadow:0 8px 24px #0009}
#tip.on{opacity:1;transform:none}
/* ===== esqueleto de carga ===== */
.sk{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#14141d 25%,#212134 50%,#14141d 75%);background-size:220% 100%;animation:shim 1.3s linear infinite}
.sk.s1{width:38%}.sk.s2{width:72%;height:36px;margin:16px 0}.sk.s3{width:52%}
@keyframes shim{to{background-position:-220% 0}}
/* ===== edición de tarjetas ===== */
.wbar{display:none}
.editing .wd{outline:1.5px dashed #4a49f5aa;outline-offset:3px;border-radius:24px}
.editing .wd>.card{pointer-events:none;opacity:.5}
.editing .wbar{display:flex;position:absolute;z-index:5;top:8px;right:8px;left:8px;gap:6px;justify-content:space-between;align-items:center;background:#fff;color:#000;border-radius:999px;padding:5px 8px;box-shadow:0 6px 22px #000b;animation:vfade .2s}
.wbar button{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;transition:background .15s,color .15s}
.wbar button.on{background:var(--blue);color:#fff}
.wbar svg{width:16px;height:16px}
.wbar .g{display:flex;gap:2px;align-items:center}
.wbar .drag{cursor:grab;touch-action:none}
.wd.dragging{opacity:.4}
.hid-list{display:none;margin-top:16px}
.editing .hid-list{display:block}
/* ===== ventanas ===== */
#modal{position:fixed;inset:0;background:#000000cc;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#modal.on{display:flex;animation:vfade .2s ease-out}
#modal.closing{animation:vout .2s ease-in forwards}
.sheet{background:var(--card);border:1px solid var(--bd2);border-radius:26px;width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow:auto;padding:22px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:0 30px 80px #000c}
#modal.on .sheet{animation:sheetin .3s var(--ease)}
#modal.closing .sheet{animation:sheetout .2s ease-in forwards}
.sheet.wide{width:min(900px,100%)}
.sheet h2{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:18px;margin-bottom:14px}
.sheet .grab{display:none}
.sheet>.card{border:0;padding:0;background:transparent;border-radius:0}
.sheet>.card>.ch .t{display:none}
.sheet>.card>.ch{justify-content:flex-end;min-height:0;margin-bottom:8px}
.sheet>.card>.ch:not(:has(.ca>*)){display:none}
.mhead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-22px;z-index:3;margin:-22px -22px 12px;padding:16px 22px 10px;background:var(--card);border-bottom:1px solid #15151f}
.fl{margin-bottom:12px}
.fl label{display:block;font-size:11px;letter-spacing:.8px;color:var(--mut2);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.fl.ck label{display:flex;align-items:center;gap:10px;text-transform:none;font-size:14px;color:var(--txt);letter-spacing:0;cursor:pointer}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.shake{animation:shake .38s}
.catpick .cchs{display:flex;flex-wrap:wrap;gap:7px}
.cch{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--bd2);font-size:12px;font-weight:600;color:#c9c9de;transition:background .18s,border-color .18s,color .18s,transform .12s}
.cch i{width:9px;height:9px;border-radius:50%;flex:none}
.cch.on{border-color:var(--blue2);background:#1F1EBA38;color:#fff}
.cch.add{color:var(--lav);border-style:dashed}
.cch svg{width:12px;height:12px}
.cch:active{transform:scale(.95)}
.newcat{animation:vfade .2s}
.nc-row{display:flex;gap:10px;align-items:center;margin-top:8px}
.nc-sw{width:38px;height:38px;border-radius:12px;flex:none;border:1px solid #ffffff22;transition:background .2s}
.nc-row input{flex:1}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:10px 0}
.pal i{aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .15s}
.pal i:hover{transform:scale(1.12)}
.pal i.on{border-color:#fff}
.ib.cc{border-width:2px}
.padd{display:flex;gap:10px;align-items:flex-end}
.padd .fl{flex:1;min-width:0;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* confirmación */

<script>'use strict';

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
/* github.io comparte el almacenamiento entre todas las apps del mismo usuario: las claves de esta llevan prefijo para no mezclarse con otras */
const NS='yhwh.';
const LS={get(k,d){try{const v=localStorage.getItem(NS+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(NS+k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}),nf2=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const ars=n=>(n<0?'-':'')+'$'+nf0.format(Math.abs(Math.round(n)));

const AM=h=>`<span class="amt">${h}</span>`;
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const todayISO=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+'T12:00:00Z')-new Date(b+'T12:00:00Z'))/864e5);
const curMes=()=>todayISO().slice(0,7);
const mesAdd=(m,n)=>{let[y,k]=m.split('-').map(Number);k+=n;y+=Math.floor((k-1)/12);k=((k-1)%12+12)%12+1;return y+'-'+String(k).padStart(2,'0')};
const mesName=m=>MESES[+m.slice(5)-1];
const mesTxt=m=>MES3[+m.slice(5)-1]+'/'+m.slice(2,4);
const mesesEntre=(a,b)=>{const r=[];for(let m=a;m<=b;m=mesAdd(m,1)){r.push(m);if(r.length>400)break}return r};
const fmtFecha=f=>f?f.slice(8,10)+'/'+f.slice(5,7):'';
const diasMes=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
/* el logo de Lucas, tal cual: el archivo no se toca; solo se recorta lo vacío al mostrarlo y el negro se funde con el fondo de la app */
const LOGO=c=>`<span class="logo ${c||''}" role="img" aria-label="YHWH Power"><img src="logo.png" alt="" draggable="false"></span>`;
const hash=s=>{let h=5381;s=String(s);for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
/* ===== estado ===== */
const KEY={Ingresos:'id',Egresos:'id',Recurrentes:'id',Cotizaciones:'mes',Deudas:'id',PagosDeuda:'id',Saldos:'id',Historial:'fecha'};
const DEF_CUENTAS=[{n:'InfoProductos',m:'USD'},{n:'ARS',m:'ARS'},{n:'YHWH Power',m:'USD'}];
const S={data:LS.get('cache',{}),cfg:LS.get('cachecfg',{}),sec:LS.get('sec','resumen'),per:LS.get('per',{k:'T'}),cur:LS.get('cur','todo'),acc:LS.get('acc',''),edit:false,live:false,loading:false,syncing:false};
const CFG={url:LS.get('url',''),token:LS.get('token','')};
const D=t=>S.data[t]||(S.data[t]=[]);
const isMobile=()=>matchMedia('(max-width:860px)').matches;
const FLASH=new Set();
/* ===== red ===== */
let queue=LS.get('queue',[]);
/* el servidor de esta app se identifica con APP_ID. El de otra app (por ejemplo, la de finanzas personales, que vive en el mismo
   sitio y cuya clave el navegador puede autocompletar) no lo hace: con ese servidor la app no muestra nada, no escribe nada y
   borra lo que haya guardado en el dispositivo */
const APP_ID='mis-finanzas-yhwh';
const esYHWH=r=>!!r&&r.app===APP_ID;
let srvOk=false;
const marcarOk=()=>{srvOk=true;LS.set('srv',hash(CFG.url))};
const OTRA_APP='Esa URL y ese token son de otra app, no de Mis Finanzas YHWH. No se escribió nada en esa planilla y se borró de este dispositivo lo que se había mostrado. Conectá la app con la URL y el token del proyecto APP MIS FINANZAS YHWH.';
function otraApp(){queue=[];S.data={};S.cfg={};S.live=false;S.syncing=false;srvOk=false;CFG.url='';CFG.token='';
  ['url','token','cache','cachecfg','queue','srv'].forEach(LS.del);setSync();render();showSetup(OTRA_APP)}
async function apiPost(body){
  const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,app:APP_ID,token:CFG.token}),redirect:'follow',credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'});
  return r.json()}
let flushing=false,flushTimer=null,avisoAut=false,lastLoad=0;
/* antes de escribir por primera vez en la sesión, confirma que el servidor es el de esta app */
/* sin la marca: si no es un token rechazado ni un "ocupado, probá después", es el servidor de otra app */
const esOtra=r=>!esYHWH(r)&&r.error!=='no autorizado'&&!r.retry;
async function verificar(){if(srvOk)return true;const r=await apiPost({op:'ping'});

/* manda la cola de a una. Un cambio no se pierde si el servidor está ocupado, frena por exceso de pedidos o no reconoce el token: queda en la cola */
async function flush(){if(flushing||!queue.length||!CFG.url)return;flushing=true;setSync();
  try{if(await verificar())while(queue.length){const op=queue[0];const r=await apiPost(op);
      if(!r.ok&&(r.retry||r.error==='no autorizado')){
        if(r.error==='no autorizado'){if(!avisoAut){avisoAut=true;toast('El servidor no reconoce el token. Revisá la conexión en Ajustes')}}
        else if(!flushTimer){flushTimer=setTimeout(()=>{flushTimer=null;flush()},65000)}
        break}
      if(!r.ok)toast('El servidor rechazó un cambio: '+String(r.error||'error').slice(0,80));
      queue.shift();LS.set('queue',queue)}}
  catch(e){/* sin red: queda en la cola */}
  flushing=false;setSync()}
function send(op){queue.push(op);LS.set('queue',queue);flush();setSync()}
function setSync(){const e=$('#syncdot');if(!e)return;const n=queue.length,busy=S.syncing||flushing;e.className=busy?'busy':n?'pend':S.live?'ok':'off';e.title=busy?'Sincronizando…':n?n+' cambios pendientes':S.live?'Sincronizado':'Sin conexión'}
const persist=()=>{LS.set('cache',S.data);LS.set('cachecfg',S.cfg)};
const hasData=()=>Object.keys(S.data).some(k=>(S.data[k]||[]).length);
async function load(){
  if(!CFG.url)return false;
  S.syncing=true;setSync();
  try{const r=await apiPost({op:'read'});
    if(esOtra(r)){otraApp();return false}
    if(!r.ok)throw new Error(r.error||'error');
    marcarOk();await flush();
    /* Deudas y PagosDeuda viven en la planilla de la otra app: si el servidor no las pudo leer, se queda con la última copia y avisa */
    const prev={Deudas:D('Deudas'),PagosDeuda:D('PagosDeuda')},ce=r.data.compartidas_error;
    S.data=r.data;S.cfg=r.data.Config||{};delete S.data.Config;delete S.data.compartidas_error;
    if(ce){S.data.Deudas=prev.Deudas;S.data.PagosDeuda=prev.PagosDeuda;S.deuErr=String(ce).slice(0,160)}else S.deuErr='';

   {k:'donde',l:'Dónde está',v:r&&r.donde,req:1,ph:'Mercury, Wise, Banco, Efectivo…',list:uniq(D('Saldos').map(x=>x.donde))},{k:'descripcion',l:'Descripción (opcional)',v:r&&r.descripcion},
   {k:'monto',l:'Saldo actual',t:'number',v:r?r.monto:'',half:1},{k:'moneda',l:'Moneda',t:'select',opts:monedaOpts('USD'),v:r?r.moneda:'USD',half:1}],
   onOk:o=>{up('Saldos',{id:r?r.id:uid(),donde:o.donde,descripcion:o.descripcion,moneda:o.moneda,monto:o.monto,actualizado:todayISO()})},
   onDel:r?()=>del('Saldos',r.id):null})}
/* ---- listas ---- */
function rowIng(r){const sub=[r.oferta,r.mercado,tagCta(r)].filter(Boolean).join(' · ');
  return `<div class="tr ig" data-rt="edIng" data-p="${esc(r.id)}"><span class="mut">${fmtFecha(r.fecha)}</span><span class="d2"><span class="d">${esc(r.descripcion)}</span>${sub?`<span class="d sm2">${esc(sub)}</span>`:''}</span><span class="r"><b>${AM(money(r.monto,r.moneda))}</b></span>${editDel('edIng','delIng',r.id)}</div>`}
function rowEgr(e){const pd=isPaid(e);
  return `<div class="tr te" data-rt="edEgr" data-p="${esc(e.id)}"><span class="c1">${chkB(pd,'pay',e.id)}</span><span class="d2"><span class="d${pd?' paid':''}">${esc(e.descripcion)}</span><span class="d sm2"><i class="dot" style="background:${catColor(e.categoria)}"></i>${fmtFecha(e.fecha)} · ${esc(e.categoria||SINCAT)}${esAgg()?' · '+esc(cuentaDe(e)):''}<span class="mo"> ${vencChip(e)}</span></span></span><span class="vc">${vencChip(e)}</span><span class="r"><b>${AM(money(e.monto,e.moneda||'USD'))}</b></span>${editDel('edEgr','delEgr',e.id)}</div>`}
const egrHead=()=>`<div class="tr te th"><span class="c1"></span><span>Descripción</span><span class="vc">Vence</span><span class="r">Monto</span><span class="ed"></span></div>`;
const moreRow=(tot,shown,wid,full)=>(!full&&wid&&tot>shown)?`<button class="morerow" data-a="more" data-p="${esc(wid)}">+${tot-shown} más ›</button>`:'';
function egrTable(list,full,n,emptyMsg,wid){if(!list.length)return empty(emptyMsg||'Sin egresos en este período');
  const L=lim(list,full,n);return `<div class="tb">${egrHead()}${L.map(rowEgr).join('')}</div>`+moreRow(list.length,L.length,wid,full)}
const sortEgr=(a,b)=>{const x=a.venc||a.fecha||'9',y=b.venc||b.fecha||'9';return x<y?-1:x>y?1:0};
const totEgrRow=(list,lbl)=>`<div class="tr tot" style="--c:1fr auto"><span>${lbl||'TOTAL'}</span><span class="r">${AA(sumV(list,vEgr))}</span></div>`;
const sinData=()=>!ingAll().length&&!egrAll().length;
/* intervalos para gráficos: por día, por semana o por mes según el largo del período */
function buckets(P){const a=P.from,b=P.to,span=diffDays(b,a)+1;
  if(span<=45){const r=[];for(let d=a;d<=b&&r.length<60;d=addDays(d,1))r.push({a:d,b:d,label:fmtFecha(d)});return r}
  if(span<=200){const r=[];for(let d=a;d<=b&&r.length<40;d=addDays(d,7))r.push({a:d,b:addDays(d,6)>b?b:addDays(d,6),label:fmtFecha(d)});return r}
  return mesesEntre(a.slice(0,7),b.slice(0,7)).map(m=>({a:m+'-01',b:m+'-31',label:MES3[+m.slice(5)-1]}))}
const fmCur=()=>S.cur==='todo'?mainC():S.cur;
const fmV=(v,m)=>m==='usd'?usd(v):ars(v);
/* ---- widgets resumen ---- */
const W={};
W.hero=()=>{const P=PD(),ing=totIng(P),egr=totEgr(P),b=subV(ing,egr);
  return `<div class="card hl"><div class="ch"><span class="t">${heroTitle('BALANCE',P)}</span>${eyeBtn('all')}</div>${BIG(b,'hero')}<div class="sub">${AS(b)||'Ingresos menos egresos'}</div>
  <div class="hl2"><div><small>Ingresos</small><b>${AA(ing)}</b></div><div><small>Egresos</small><b>${AA(egr)}</b></div></div></div>`};
W.cot=()=>{const P=PD(),mm=monthOfP(P),set=cotSet(mm);
  return `<div class="card">${hdr('Cotización USD',`<button class="ib sm" data-a="edCot" data-p="${mm}" title="Editar">${I('pen')}</button>`)}<div class="mid">${ars(cotOf(mm))} <small>por US$ 1 · ${mesName(mm)}</small></div>${set?'':`<div class="sub"><span class="chip w">SIN CARGAR</span> Estoy usando la última que cargaste</div>`}<div style="margin-top:12px"><button class="more" data-a="histCot">Ver historial de meses ›</button></div></div>`};
W.cIng=()=>{const P=PD(),L=ingresosP(P),t=sumV(L,vIng);return `<div class="card">${hdr('Ingresos',eyeBtn('cIng'),'')}${BIG(t,'cIng',null,'mid')}<div class="sub">${AS(t)||L.length+' movimientos'}</div></div>`};
W.cEgr=()=>{const P=PD(),L=egresosP(P),t=sumV(L,vEgr);const[pg,n]=cnt(L);return `<div class="card">${hdr('Egresos',eyeBtn('cEgr'))}${BIG(t,'cEgr',null,'mid')}<div class="sub">${AS(t)||''}${S.cur==='todo'&&AS(t)?' · ':''}${pg} de ${n} pagados</div></div>`};
W.pend=(full)=>{const L=egrAll().filter(e=>!isPaid(e)).sort(sortEgr),venc=L.filter(e=>e.venc&&e.venc<todayISO()).length;
  return `<div class="card">${hdr('Qué me queda pagar',L.length?`<small>${L.length} sin pagar${venc?' · '+venc+' vencido'+(venc>1?'s':''):''}</small>`:'','pend')}${egrTable(L,full,6,'No te queda nada por pagar. Todo al día','pend')}${L.length?totEgrRow(L,'POR PAGAR'):''}</div>`};
W.dist=(full)=>{const P=PD(),L=egresosP(P),m=fmCur();const by={};L.forEach(e=>{const k=e.categoria||SINCAT;by[k]=(by[k]||0)+vEgr(e)[m]});
  const items=Object.entries(by).map(([n,v])=>({n,v,c:catColor(n)})).sort((a,b)=>b.v-a.v);const tot=items.reduce((s,i)=>s+i.v,0)||1;
  items.forEach(i=>i.tip=i.n+' · '+fmV(i.v,m)+' · '+Math.round(i.v/tot*100)+'%');
  return `<div class="card">${hdr('Distribución de egresos',`<button class="btn" data-a="editCats">Categorías</button>`)}${!items.length?empty('Sin egresos en este período'):`<div class="dist"><div class="dchart">${chartBox('dist',[items.map(i=>[i.n,i.v,i.c]),m],(w,h)=>donutSvg(items,Math.min(w,h),[fmV(tot,m).replace(/,\d\d$/,''),'egresos']),170)}</div><div>${items.map(i=>`<div class="drow"><i class="dot" style="background:${hexOk(i.c)}"></i><span class="d">${esc(i.n)}</span><b>${Math.round(i.v/tot*100)}%</b><span class="r mut">${AM(fmV(i.v,m))}</span></div>`).join('')}</div></div>`}</div>`};
W.evo=()=>{const P=PD(),m0=monthOfP(P),ms=mesesEntre(mesAdd(m0,-5),m0),m=fmCur();
  const a=ms.map(x=>({label:MES3[+x.slice(5)-1],v:totIngMes(x)[m],tip:'Ingresos '+mesTxt(x)+' · '+fmV(totIngMes(x)[m],m)})),b=ms.map(x=>({label:MES3[+x.slice(5)-1],v:totEgrMes(x)[m],tip:'Egresos '+mesTxt(x)+' · '+fmV(totEgrMes(x)[m],m)}));
  return `<div class="card">${hdr('Evolución')}<div class="lgd"><span><i class="l1"></i>Ingresos</span><span><i class="l2"></i>Egresos</span></div>${chartBox('evo',[a.map(x=>x.v),b.map(x=>x.v)],(w,h)=>lineSvg(a,b,w,h,true),190)}</div>`};
function diaItems(P,m){const L=egresosP(P);return buckets(P).map(k=>{const v=L.filter(e=>e.fecha>=k.a&&e.fecha<=k.b).reduce((s,e)=>s+vEgr(e)[m],0);return{label:k.label,v,tip:k.label+' · '+fmV(v,m)}})}
W.dia=()=>{const P=PD(),m=fmCur(),it=diaItems(P,m);
  return `<div class="card">${hdr('Gasto por día')}${it.every(x=>!x.v)?empty('Sin egresos en este período'):chartBox('dia',[P.from,P.to,m,it.map(x=>x.v)],(w,h)=>barsSvg(it,w,h),190)}</div>`};
W.acum=()=>{const P=PD(),m=fmCur(),it=diaItems(P,m);let s=0;const pts=it.map(x=>{s+=x.v;return{label:x.label,v:s,tip:x.label+' · acumulado '+fmV(s,m)}});
  return `<div class="card">${hdr('Gasto acumulado')}${s?chartBox('acum',[P.from,P.to,m,pts.map(x=>x.v)],(w,h)=>lineSvg(pts,null,w,h,true),190):empty('Sin egresos en este período')}</div>`};
W.lIng=(full)=>{const L=ingresosP(PD());return `<div class="card">${hdr('Ingresos',addBtn('addIng','','Nuevo','wh'),'lIng')}${L.length?`<div class="tb">${lim(L,full).map(rowIng).join('')}</div>${moreRow(L.length,6,'lIng',full)}`:empty('Sin ingresos en este período')}</div>`};
W.lEgr=(full)=>{const L=egresosP(PD());return `<div class="card">${hdr('Egresos',addBtn('addEgr','','Nuevo','wh'),'lEgr')}${egrTable(L,full,6,null,'lEgr')}</div>`};
/* recurrentes: la lista de tus gastos de todos los meses y cuáles ya están cargados en el mes mostrado */
W.rec=(full)=>{const P=PD(),mm=monthOfP(P),L=recAll().slice().sort((a,b)=>(+a.dia||99)-(+b.dia||99)),falt=recFaltan(mm).length,tot=sumV(L,r=>conv(r.monto,r.moneda,mm));
  const row=r=>{const ya=D('Egresos').some(e=>e.id===recId(r,mm));return `<div class="tr rc" data-rt="edRec" data-p="${esc(r.id)}"><span class="mut">${r.dia?('día '+r.dia):'—'}</span><span class="d2"><span class="d">${esc(r.descripcion)}</span><span class="d sm2"><i class="dot" style="background:${catColor(r.categoria)}"></i>${esc(r.categoria||SINCAT)}${esAgg()?' · '+esc(cuentaDe(r)):''} ${ya?'<span class="chip">CARGADO</span>':'<span class="chip w">FALTA</span>'}</span></span><span class="r"><b>${AM(money(r.monto,r.moneda))}</b></span>${editDel('edRec','delRec',r.id)}</div>`};
  return `<div class="card">${hdr('Recurrentes',addBtn('addRec','','Nuevo','wh'),'rec')}${L.length?`<small>${L.length} gastos que se repiten · ${falt?falt+' sin cargar en '+mesName(mm):'todos cargados en '+mesName(mm)}</small><div class="tb">${lim(L,full,6).map(row).join('')}<div class="tr tot" style="--c:1fr auto"><span>POR MES</span><span class="r">${AA(tot)}</span></div></div>${moreRow(L.length,6,'rec',full)}${falt?`<div class="acts" style="justify-content:flex-start"><button class="btn wh" data-a="cargarRec" data-p="${mm}">${I('repeat')}Cargar los que faltan en ${mesName(mm)} (${falt})</button></div>`:''}`:empty('Todavía no cargaste gastos que se repiten (Google Workspace, Claude, etc.)',`<div style="margin-top:10px">${addBtn('addRec','','Agregar el primero','wh')}</div>`)}</div>`};
W.saR=()=>{const a=totalSaldos();return `<div class="card">${hdr('Saldos',eyeBtn('saR'),'')}${BIG(a,'saR',null,'mid')}<div class="sub">${AS(a)||D('Saldos').length+' cuentas'}</div><div style="margin-top:12px"><button class="more" data-a="go" data-p="saldos">Ver más ›</button></div></div>`};
W.deR=()=>{const t=sumV(deudasAct(),d=>vDeu(d,'monto_actual'));return `<div class="card">${hdr('Préstamos y deudas',eyeBtn('deR'))}${BIG(t,'deR',null,'mid')}<div class="sub">${AS(t)}</div><div style="margin-top:12px"><button class="more" data-a="go" data-p="deudas">Ver más ›</button></div></div>`};
/* ---- ingresos ---- */
W.heroI=()=>{const P=PD(),L=ingresosP(P),t=sumV(L,vIng);return `<div class="card hl"><div class="ch"><span class="t">${heroTitle('LO QUE GANASTE',P)}</span>${eyeBtn('all')}</div>${BIG(t,'heroI')}<div class="sub">${AS(t)||''}${AS(t)?' · ':''}${L.length} ${L.length===1?'ingreso':'ingresos'}</div>
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn bk" data-a="addIng">${I('plus')}Nuevo ingreso</button></div></div>`};
function agrupar(L,campo,vacio,m){const by={};L.forEach(r=>{const k=r[campo]||vacio;by[k]=(by[k]||0)+vIng(r)[m]});return Object.entries(by).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v)}
function barList(items,m,empt){if(!items.length||items.every(i=>!i.v))return empty(empt);const mx=Math.max(...items.map(i=>i.v))||1,tot=items.reduce((s,i)=>s+i.v,0)||1;
  return `<div class="hbl">${items.map(i=>`<div class="hb"><span class="d">${esc(i.n)}</span><div class="bar"><i style="width:${Math.max(2,i.v/mx*100)}%"></i></div><b>${AM(fmV(i.v,m))}</b><small>${Math.round(i.v/tot*100)}%</small></div>`).join('')}</div>`}
W.porOferta=()=>{const L=ingresosP(PD()),m=fmCur();return `<div class="card">${hdr('Ingresos por oferta',eyeBtn('porOferta'))}${barList(agrupar(L,'oferta','Sin oferta',m),m,'Sin ingresos en este período')}</div>`};
W.porMercado=()=>{const L=ingresosP(PD()),m=fmCur();return `<div class="card">${hdr('Ingresos por mercado',eyeBtn('porMercado'))}${barList(agrupar(L,'mercado','Sin mercado',m),m,'Sin ingresos en este período')}</div>`};
W.mov=(full)=>{const L=ingresosP(PD());return `<div class="card">${hdr('Movimientos',addBtn('addIng','','Nuevo ingreso','wh'),'mov')}${L.length?`<div class="tb">${lim(L,full,8).map(rowIng).join('')}</div>${moreRow(L.length,8,'mov',full)}`:empty('Sin ingresos en este período',`<div style="margin-top:10px">${addBtn('addIng','','Cargar el primero','wh')}</div>`)}</div>`};
W.diaI=()=>{const P=PD(),m=fmCur(),L=ingresosP(P),it=buckets(P).map(k=>{const v=L.filter(e=>e.fecha>=k.a&&e.fecha<=k.b).reduce((s,e)=>s+vIng(e)[m],0);return{label:k.label,v,tip:k.label+' · '+fmV(v,m)}});
  return `<div class="card">${hdr('Ingresos por día')}${it.every(x=>!x.v)?empty('Sin ingresos en este período'):chartBox('diaI',[P.from,P.to,m,it.map(x=>x.v)],(w,h)=>barsSvg(it,w,h),190)}</div>`};
/* ---- egresos ---- */
W.heroE=()=>{const P=PD(),L=egresosP(P),t=sumV(L,vEgr);const[pg,n]=cnt(L);
  return `<div class="card hl"><div class="ch"><span class="t">${heroTitle('EGRESOS',P)}</span>${eyeBtn('all')}</div>${BIG(t,'heroE')}<div class="sub">${AS(t)||''}${AS(t)?' · ':''}${pg} de ${n} pagados</div>
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn bk" data-a="addEgr">${I('plus')}Nuevo egreso</button><button class="btn out" data-a="cargarRec" data-p="${monthOfP(P)}">${I('repeat')}Cargar recurrentes</button><button class="btn out" data-a="dupMes">${I('dup')}Duplicar mes</button></div></div>`};
W.listaE=(full)=>{const L=egresosP(PD());return `<div class="card">${hdr('Egresos del período',addBtn('addEgr','','Nuevo','wh'),'listaE')}${L.length?`<small>${cnt(L)[0]} de ${L.length} pagados</small>`:''}${egrTable(L,full,10,'Sin egresos en este período','listaE')}${L.length?totEgrRow(L):''}</div>`};
/* ---- saldos (cargados a mano) ---- */
W.heroA=()=>{const a=totalSaldos();return `<div class="card hl"><div class="ch"><span class="t">TOTAL SALDOS</span>${eyeBtn('all')}</div>${BIG(a,'heroA','usd')}<div class="sub">${AS(a,'usd')||''}</div><div style="margin-top:14px"><button class="btn bk" data-a="addSaldo">${I('plus')}Nuevo saldo</button></div></div>`};
W.saL=(full)=>{const L=D('Saldos');return `<div class="card">${hdr('Cuentas y saldos',addBtn('addSaldo','','Nuevo','wh'))}${L.length?`<div class="tb">${L.map(r=>`<div class="tr sa" data-rt="edSaldo" data-p="${esc(r.id)}"><span class="d2"><span class="d">${esc(r.donde)}</span><span class="d sm2">${esc(r.descripcion||'')}${r.actualizado?(r.descripcion?' · ':'')+'al '+fmtFecha(r.actualizado):''}</span></span><span class="r"><b>${AM(money(r.monto,r.moneda))}</b></span>${editDel('edSaldo','delSaldo',r.id)}</div>`).join('')}</div>`:empty('Todavía no cargaste saldos. Tocá Nuevo y anotá lo que tenés en cada lugar',`<div style="margin-top:10px">${addBtn('addSaldo','','Cargar el primero','wh')}</div>`)}</div>`};
function histSeries(){const H=D('Historial').filter(r=>r.fecha&&r.saldos_usd!==''&&r.saldos_usd!=null).sort((a,b)=>a.fecha<b.fecha?-1:1);const byM={};H.forEach(r=>{byM[String(r.fecha).slice(0,7)]=+r.saldos_usd||0});
  if(D('Saldos').length)byM[curMes()]=totalSaldos().usd;return Object.keys(byM).sort().slice(-(isMobile()?6:12)).map(m=>({m,v:byM[m]}))}
W.saH=()=>{const s=histSeries();if(!s.length)return `<div class="card">${hdr('Historial')}${empty('Cada día a la 1:00 se guarda una foto de tus saldos. Acá vas a ver cómo evolucionan mes a mes')}</div>`;
  const last=s[s.length-1],prev=s[s.length-2];let delta='Se empieza a registrar desde hoy: cada día se guarda una foto y acá se compara contra meses anteriores.';
  if(prev){const d=last.v-prev.v,p=prev.v?d/prev.v*100:0;delta=`${d>=0?'+':'-'}${usd(Math.abs(d))} (${d>=0?'+':''}${p.toFixed(1).replace('.',',')}%) frente a ${mesName(prev.m)}`}
  const it=s.map(x=>({label:MES3[+x.m.slice(5)-1],v:x.v,tip:mesTxt(x.m)+' · '+usd(x.v)}));
  return `<div class="card">${hdr('Historial de saldos')}${chartBox('saH',s.map(x=>x.v),(w,h)=>barsSvg(it,w,h),170)}<div class="sub" style="font-size:12px">${AM(delta)}</div></div>`};
/* ---- deudas ---- */
const vDT=(d)=>vDeu(d,'monto_total');
W.heroD=()=>{const t=sumV(deudasAct(),d=>vDeu(d,'monto_actual'));const n=deudasAct().length;return `<div class="card hl"><div class="ch"><span class="t">ACTUAL PRESTAMOS/DEUDAS</span>${eyeBtn('all')}</div>${BIG(t,'heroD','usd')}<div class="sub">${AS(t,'usd')}${AS(t,'usd')?' · ':''}${n} registros</div>${S.deuErr?`<div class="deuerr">${esc(S.deuErr)}. Muestro la última copia guardada.</div>`:`<div class="sub" style="font-size:11px">Compartidas con tu app Finanzas</div>`}</div>`};
W.dch=()=>{const act=sumV(deudasAct(),d=>vDeu(d,'monto_actual')).usd,tot=sumV(D('Deudas'),vDT).usd,mx=Math.max(1,act,tot);
  const bar=(l,v,w)=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span class="mut">${l}</span><b>${AM(usd(v))}</b></div><div class="bar" style="height:14px"><i style="width:${v/mx*100}%;background:${w}"></i></div></div>`;
  return `<div class="card">${hdr('Actual vs total')}${bar('Actual',act,'linear-gradient(90deg,#2a29d4,#8c8cff)')}${bar('Total',tot,'#3a3a55')}</div>`};
const deuFin=P=>{const f=P.to,h=todayISO();return f>h?h:f};
function deuList(tipo){const P=PD(),fin=deuFin(P);return D('Deudas').filter(d=>d.tipo===tipo).map(d=>({...d,monto_actual:deuSaldoEn(d,fin)})).filter(d=>d.monto_actual>0).sort(byAlta)}
const deuPasado=P=>deuFin(P)<todayISO();
function deuTable(tipo,full){const P0=PD(),L=deuList(tipo);const t=sumV(L,d=>conv(d.monto_actual,d.moneda,deuFin(P0).slice(0,7)));
  const c='minmax(0,.8fr) minmax(0,1fr) 112px 62px';
  return `<div class="card">${hdr((tipo==='DEUDA'?'Deudas':'Préstamos')+(deuPasado(P0)?' <small>al cierre de '+mesTxt(deuFin(P0).slice(0,7))+'</small>':''),addBtn('addDeu',tipo,tipo==='DEUDA'?'Nueva':'Nuevo','wh'))}${L.length?`<div class="tb"><div class="tr th dl" style="--c:${c}"><span>A quién</span><span class="hm">Descripción</span><span class="r">Monto</span><span class="ed"></span></div>${L.map(d=>`<div class="tr dl" data-rt="edDeu" data-p="${esc(d.id)}" style="--c:${c}"><span class="d2"><span class="d">${esc(d.quien)}</span><span class="d mut mo">${esc(d.descripcion)}</span></span><span class="d mut hm">${esc(d.descripcion)}</span><span class="r"><b>${AM(money(d.monto_actual,d.moneda))}</b></span>${editDel('edDeu','delDeu',d.id)}</div>`).join('')}<div class="tr tot" style="--c:1fr auto"><span>TOTAL</span><span class="r">${AA(t,'usd')}</span></div></div>`:empty('Sin registros')}</div>`}

/* Duplicar mes: copia los egresos de un mes a otro, sin pagar y con el vencimiento corrido. Lo que ya está en el destino no se repite */
ACT.dupMes=()=>{const P=PD(),src=monthOfP(P),opts=monthOpts();const todos=egrAll().filter(e=>mesDe(e)===src);
  form({title:'Duplicar egresos de '+mesName(src),fields:[{k:'to',l:'Copiar a',t:'select',opts,v:mesAdd(src,1)},{k:'que',l:'Qué copiar',t:'select',opts:[{v:'rec',l:'Solo los recurrentes ('+todos.filter(e=>Number(e.recurrente)===1).length+')'},{v:'todos',l:'Todos ('+todos.length+')'}],v:todos.some(e=>Number(e.recurrente)===1)?'rec':'todos'}],ok:'Duplicar',
   extra:'<small style="display:block;color:var(--mut2);margin-bottom:6px">Si el mes de destino ya tiene un gasto con el mismo nombre y categoría, no se vuelve a agregar. Después podés cambiar los montos.</small>',
   onOk:o=>{if(o.to===src){toast('Elegí otro mes');return false}

    const have={};egrAll().filter(e=>mesDe(e)===o.to).forEach(e=>{const k=egrKey(e);have[k]=(have[k]||0)+1});
    const nuevos=[];
    L.forEach(e=>{const k=egrKey(e);if(have[k]>0){have[k]--;return}
      const mv=(f)=>{if(!f)return '';const d=Math.min(+f.slice(8,10),diasMes(o.to));return o.to+'-'+String(d).padStart(2,'0')};
      nuevos.push({id:uid(),cuenta:cuentaReal(e),mes:o.to,fecha:mv(e.fecha)||o.to+'-01',descripcion:e.descripcion,categoria:e.categoria||'',moneda:e.moneda,monto:e.monto,venc:mv(e.venc||e.fecha),pagado:0,recurrente:Number(e.recurrente)===1?1:0})});
    const ya=L.length-nuevos.length;
    upMany('Egresos',nuevos);setPerMonth(o.to);render();
    toast(nuevos.length?(nuevos.length===1?'Se agregó 1 egreso':'Se agregaron '+nuevos.length+' egresos')+' a '+mesName(o.to)+(ya?'. '+(ya===1?'1 ya estaba':ya+' ya estaban'):''):L.length?'Todos ya estaban en '+mesName(o.to):'No hay egresos para copiar')}})};

/* registrar un pago (o una suma) y guardarlo en el historial; la deuda baja o sube en el mismo envío */
function regMov(d,tipo,monto,fecha,nota){monto=r2(Math.abs(monto));if(!(monto>0)){toast('Poné el monto');return false}
  if(fecha>todayISO()){toast('La fecha no puede ser futura');return false}
  const act=+d.monto_actual||0;let cambio=tipo==='pago'?-monto:monto,tope=false;
  if(tipo==='pago'&&monto>act){cambio=-act;tope=true}
  if(cambio===0){toast('Esa deuda ya está en cero');return false}
  const nuevo=r2(Math.max(0,act+cambio)),row={id:d.id,monto_actual:nuevo,saldada:nuevo>0?0:1};
  if(tipo==='suma')row.monto_total=r2((+d.monto_total||0)+monto);
  upMulti([['Deudas',row],['PagosDeuda',{id:uid(),deuda:d.id,fecha,mes:fecha.slice(0,7),tipo,moneda:d.moneda,cambio,nota:nota||''}]]);
  setPerMonth(fecha.slice(0,7));
  render();
  toast((tipo==='pago'?'Pago registrado: '+money(-cambio,d.moneda):'Sumado a la deuda: '+money(cambio,d.moneda))+(nuevo>0?'. Quedan '+money(nuevo,d.moneda):'. Deuda saldada')+(tope?' (era todo lo que debías)':''));return true}

function formPag(id){const p=D('PagosDeuda').find(x=>x.id===id);if(!p)return;const d=D('Deudas').find(x=>x.id===p.deuda),sg=(+p.cambio||0)<0?-1:1;

     if(d&&dif!==0){const act=r2(Math.max(0,(+d.monto_actual||0)+dif)),row={id:d.id,monto_actual:act,saldada:act>0?0:1};if(p.tipo==='suma')row.monto_total=r2(Math.max(0,(+d.monto_total||0)+dif));lista.unshift(['Deudas',row])}

/* importar: acepta la copia de seguridad de la app ({data:{…}}) o un objeto con las tablas */
async function importFile(f){try{
  if(f.size>5*1024*1024)throw new Error('el archivo pesa más de 5 MB');
  if(!/\.json$/i.test(f.name||''))throw new Error('tiene que ser un archivo .json');
  let j=JSON.parse(await f.text());if(!j||typeof j!=='object'||Array.isArray(j))throw new Error('el archivo no tiene el formato esperado');
  const cfgIn=j.config&&typeof j.config==='object'&&!Array.isArray(j.config)?j.config:null;
  if(j.data&&typeof j.data==='object'&&!Array.isArray(j.data))j=j.data;
  let n=0,rech=0;
  if(!await verificar())throw new Error('no pude confirmar que el servidor sea el de esta app');
  for(const t of TABLAS_IMP){const rows=(Array.isArray(j[t])?j[t]:[]).filter(x=>x&&typeof x==='object'&&!Array.isArray(x));if(rows.length>20000)throw new Error('demasiadas filas en '+t);
    for(let i=0;i<rows.length;i+=250){toast(`Importando ${t} ${Math.min(i+250,rows.length)}/${rows.length}…`);const r=await apiPost({op:'import',tables:{[t]:rows.slice(i,i+250)}});if(!r.ok)throw new Error(r.error);n+=(r.counts&&r.counts[t])||0;rech+=(r.counts&&r.counts.rechazadas)||0}}
  /* categorías con color: solo si todavía no hay ninguna guardada, para no pisar las tuyas */
  const cc=cfgIn&&cfgIn.cats,hay=cfg('cats',null);
  if(Array.isArray(cc)&&cc.length&&!(Array.isArray(hay)&&hay.length)){
    const L=cc.filter(x=>x&&typeof x==='object'&&typeof x.n==='string'&&x.n.trim()).slice(0,60).map(x=>({n:x.n.replace(/[\u0000-\u001f]/g,'').trim().slice(0,40),c:hexOk(x.c)}));
    if(L.length){const r=await apiPost({op:'config',key:'cats',value:L});if(!r.ok)throw new Error(r.error)}}
  await load();render();toast('Importado: '+n+' registros nuevos'+(rech?' ('+rech+' filas con datos inválidos se saltearon)':''))}catch(e){toast('No se pudo importar: '+e.message)}}

/* ===== bloqueo (PIN + Face ID) ===== */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const buf2b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const b642buf=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let pinBuf='',lockMode='check',pinCb=null,newLen=6;
const pinLen=()=>lockMode==='check'?(((LS.get('lock',null)||{}).len)===4?4:6):newLen;
const lockOpen=()=>$('#lock').classList.contains('on');
function showLock(msg){const L=LS.get('lock',null);if(!L)return;$('#lock').classList.add('on');drawLock(msg)}
function hideLock(){$('#lock').classList.remove('on')}
function shakeDots(){const d=$('#lock .dots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}}
function drawLock(msg,title){const L=LS.get('lock',null),el=$('#lock');
  el.innerHTML=`${LOGO('lk')}<div class="h" style="font-size:18px">${esc(title||'MIS FINANZAS')}</div><small>${esc(msg||(lockMode==='check'?(L&&L.cred?'Face ID o ingresá tu PIN':'Ingresá tu PIN'):''))}</small><div class="dots">${Array.from({length:pinLen()},(_,i)=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
  <div class="pin">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="face" style="font-size:12px">${L&&L.cred&&lockMode==='check'?'Face ID':''}</button><button data-k="0">0</button><button data-k="del">⌫</button></div>${lockMode==='check'?'':'<button class="btn" data-k="cancel">Cancelar</button>'}`;
  $$('[data-k]',el).forEach(b=>b.onclick=()=>pinKey(b.dataset.k));
  el.onpointerup=ev=>{const l2=LS.get('lock',null);if(l2&&l2.cred&&lockMode==='check'&&!ev.target.closest('[data-k]'))faceUnlock()}}
async function pinKey(k){const L=LS.get('lock',null);
  if(k==='face'){if(L&&L.cred&&lockMode==='check')faceUnlock();return}
  if(k==='cancel'){pinBuf='';hideLock();pinCb=null;lockMode='check';return}
  if(lockMode==='check'&&k!=='del'){const f=LS.get('lockfail',{n:0,until:0});if(f.until>Date.now()){drawLock('Demasiados intentos. Esperá '+Math.ceil((f.until-Date.now())/1000)+' s');shakeDots();return}}
  if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<pinLen())pinBuf+=k;
  drawLock();
  if(lockMode==='check'&&pinBuf.length===pinLen()&&L){const h=await sha(L.salt+pinBuf);
    if(h===L.pin){pinBuf='';LS.del('lockfail');hideLock()}
    else{pinBuf='';const f=LS.get('lockfail',{n:0,until:0});f.n++;if(f.n%5===0)f.until=Date.now()+Math.min(900000,30000*2**(f.n/5-1));LS.set('lockfail',f);drawLock(f.until>Date.now()?'Demasiados intentos. Esperá '+Math.ceil((f.until-Date.now())/1000)+' s':'PIN incorrecto');shakeDots()}}
  if(lockMode!=='check'&&pinBuf.length===pinLen()){const cb=pinCb;const p=pinBuf;pinBuf='';cb&&cb(p)}}
/* en la compu también se puede tipear el PIN */
document.addEventListener('keydown',e=>{if(!lockOpen()||e.metaKey||e.ctrlKey||e.altKey)return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('del')});
let faceBusy=false;
async function faceUnlock(auto){const L=LS.get('lock',null);if(!L||!L.cred||faceBusy)return;faceBusy=true;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{id:b642buf(L.cred),type:'public-key',transports:['internal']}],userVerification:'required',hints:['client-device'],timeout:60000}});faceBusy=false;LS.del('lockfail');hideLock()}
  catch(e){faceBusy=false;drawLock(auto?'Tocá la pantalla para usar Face ID, o ingresá el PIN':'No se pudo con Face ID. Tocá la pantalla para reintentar o usá el PIN')}}
function askPin(title,cb){lockMode='new';pinBuf='';pinCb=cb;$('#lock').classList.add('on');drawLock(newLen+' dígitos',title)}

ACT2.lockOn=()=>askLen(6,()=>askPin('Elegí un PIN',p1=>askPin('Repetí el PIN',async p2=>{if(p1!==p2){lockMode='check';hideLock();toast('Los PIN no coinciden');return}
  const salt=uid(),h=await sha(salt+p1);LS.set('lock',{pin:h,salt,cred:null,t:60,len:newLen});lockMode='check';hideLock();render();

ACT2.pinChange=()=>askLen((LS.get('lock',null)||{}).len||6,()=>askPin('Nuevo PIN',p1=>askPin('Repetí el PIN',async p2=>{const len=newLen;lockMode='check';hideLock();if(p1!==p2){toast('No coinciden');return}const L=LS.get('lock'),salt=uid();L.salt=salt;L.pin=await sha(salt+p1);L.len=len;LS.set('lock',L);render();toast('PIN cambiado a '+len+' dígitos')})));
ACT2.lockOff=()=>ask('¿Quitar el bloqueo de la app?','Quitar',()=>{LS.del('lock');LS.del('lockfail');render()});
ACT2.faceReg=async()=>{const L=LS.get('lock',null);if(!L)return;
  try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Mis Finanzas YHWH'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'mis-finanzas',displayName:'Mis Finanzas YHWH'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'discouraged',requireResidentKey:false,userVerification:'required'},hints:['client-device'],attestation:'none',timeout:60000}});
    L.cred=buf2b64(c.rawId);LS.set('lock',L);toast('Face ID registrado');render()}catch(e){toast('No se pudo registrar Face ID')}};
ACT2.lockNow=()=>{closeModal();if(!LS.get('lock',null)){toast('Activá el bloqueo en Ajustes');return}lockMode='check';pinBuf='';showLock()};
let hiddenAt=0;

  if(document.hidden){hiddenAt=Date.now();return}

  el.innerHTML=`${LOGO('lk')}<div class="h" style="font-size:18px">MIS FINANZAS</div><small>Conectá la app con tu planilla</small><div class="sset"><div class="fl"><label>URL de tu Apps Script (termina en /exec)</label><input id="su" name="yhwh-servidor" maxlength="300" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
   <div class="fl"><label>Token de acceso</label><input id="st" name="yhwh-clave" type="password" maxlength="120" value="${esc(CFG.token)}" placeholder="El que te mostró el script" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div class="acts" style="justify-content:stretch">${had?'<button class="btn" id="scan">Cancelar</button>':''}<button class="btn wh" id="sgo" style="flex:1;justify-content:center">Conectar</button></div><small id="smsg" style="display:block;margin-top:10px">${esc(msg||'')}</small><small style="display:block;margin-top:8px">Se guardan solo en este dispositivo.</small></div>`;

  $('#sgo').onclick=async()=>{const u=$('#su').value.trim(),t=$('#st').value.trim();if(!/^https:\/\/script\.google\.com\//.test(u)){$('#smsg').textContent='La URL tiene que empezar con https://script.google.com/';return}
    if(!t){$('#smsg').textContent='Falta el token';return}

async function start(){

async function boot(){
